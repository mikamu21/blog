[package]
name = "search-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
stratum-kafka = { path = "../stratum-kafka" }
kube = { version = "2.0.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.26.0", features = ["v1_32"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
futures = "0.3"
rdkafka = { version = "0.38", features = ["cmake-build"] }
uuid = { version = "1.0", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
meilisearch-sdk = "0.27"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[[bin]]
name = "controller"
path = "src/main.rs"

[[bin]]
name = "consumer"
path = "src/bin/consumer.rs"

[[bin]]
name = "producer"
path = "src/bin/producer.rs"

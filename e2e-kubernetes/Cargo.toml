[package]
name = "e2e-kubernetes"
version = "0.1.0"
edition = "2024"

[dependencies]
rdkafka = { version = "0.38", features = ["cmake-build"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
kube = { version = "2.0.1", features = ["runtime", "derive"] }
k8s-openapi = {version="0.26.0", features=["v1_32"]}
uuid = { version = "1.11", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"

[dev-dependencies]
# Uses same dependencies as main for tests
